
services:
###> pitlane/app ###
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/app:cached
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${AC_SERVERS_DIR:-./var/ac-servers}:/ac-servers
      - ${AC_CONTENT_DIR:-./var/ac-content}:/ac-content
    ports:
      - "8000:8000"
    environment:
      # Inside the container Postgres is reached by its service name, not 127.0.0.1
      # (the host .env DATABASE_URL uses 127.0.0.1 for host-side tooling via the port map).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8"
      # Host-absolute path to the servers dir. Pitlane runs in this container but drives the host
      # daemon, which resolves game-container bind sources on the host — so it needs the real host path,
      # not the in-container one. ${PWD} is the repo root where docker compose is invoked.
      AC_SERVERS_HOST_DIR: "${PWD}/var/ac-servers"
    networks:
      - default
      - pitlane
    depends_on:
      database:
        condition: service_healthy
###< pitlane/app ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

networks:
###> pitlane/app ###
  pitlane:
    name: ${DOCKER_NETWORK:-pitlane}
###< pitlane/app ###
